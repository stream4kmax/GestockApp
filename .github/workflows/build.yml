name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get dependencies
        run: flutter pub get
        working-directory: gestock_pos_etape1/gestock_pos
      - name: Build APK
        run: flutter build apk --release
        working-directory: gestock_pos_etape1/gestock_pos
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: application-finale
          path: gestock_pos_etape1/gestock_pos/build/app/outputs/flutter-apk/app-release.apk
